<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Styled To-Do List</title>
        <link rel="stylesheet" href="styless.css">
    </head>

    <body>
        <main class="todo-container">
            <h1>My To-Do List</h1>
            <ul class="todo-list">
                <li class="list-object">
                    <input type="checkbox" name="list-todo" id="gaming" class="checkbox_input">
                    <label for="gaming">Explore gaming keyboards</label>

                    <ul class="sub-item">
                        <li><a href="#" target="_blank" class="sub-item-link">Store link</a></li>
                    </ul>
                </li>

                <li class="list-object">
                    <input type="checkbox" name="list-todo" id="report" class="checkbox_input">
                    <label for="report">Finish the report</label>

                    <ul class="sub-item">
                        <li><a href="#" target="_blank" class="sub-item-link">Request Access</a></li>
                    </ul>
                </li>

                <li class="list-object">
                    <input type="checkbox" name="list-todo" id="phone" class="checkbox_input">
                    <label for="phone">View Phone's Warranty</label>

                    <ul class="sub-item">
                        <li><a href="#" target="_blank" class="sub-item-link">View receipts</a></li>
                    </ul>
                </li>

                <li class="list-object">
                    <input type="checkbox" name="list-todo" id="processor" class="checkbox_input">
                    <label for="processor">Check Processor Specs</label>

                    <ul class="sub-item">
                        <li><a href="#" target="_blank" class="sub-item-link">View Model Number</a></li>
                    </ul>
                </li>
            </ul>
        </main>
    </body>
</html>
