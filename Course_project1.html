<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="Course_project1.css">
</head>

<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form action="#">
            <label for="name">Full Name: </label>
            <input type="text" name="name" id="name" class="name" placeholder="Enter your name" required>

            <label for="email">Email: </label>
            <input type="email" name="email" id="email" class="email" placeholder="Enter your email" required>

            <label for="position">Position: </label>
            <select name="position" id="position" class="position" required>
                <option value="">Select a position</option>
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="manager">Manager</option>
            </select>

            <fieldset class="radio-group">
                <legend>Availability:</legend>

                <input class="radio-btn" type="radio" name="availability" id="fulltime" value="fulltime" checked>
                <label for="fulltime">Full-Time</label>
                <input class="radio-btn" type="radio" name="availability" id="partime" value="partime">
                <label for="partime">Part-Time</label>
            </fieldset>

            <label for="message">Why do you want this job?</label>
            <textarea name="message" id="message" placeholder="Write your motivation"rows="4" cols="50" required></textarea>

            <button type="submit" class="submit-btn">Submit Application</button>
        </form>
    </div>
</body>
</html>
