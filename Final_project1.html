<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Playing Cards</title>
        <link rel="stylesheet" href="Final_project1.css">
    </head>

    <body>
        <main id="playing-cards">
            <div class="card spades">
                <div class="left">
                    <p>A</p>
                    <p>♠</p>
                </div>

                <div class="middle">
                    <p class="spade">♠</p>
                </div>

                <div class="right">
                    <p>A</p>
                    <p>♠</p>
                </div>
            </div>

            <div class="card clubs">
                <div class="left">
                    <p>2</p>
                    <p>♣</p>
                </div>

                <div class="middle">
                    <div>
                        <p>♣</p>
                    </div>

                    <div class="rotate-sign">
                        <p>♣</p>
                    </div>
                </div>

                <div class="right">
                    <p>2</p>
                    <p>♣</p>
                </div>
            </div>

            <div class="card hearts">
                <div class="left">
                    <p>3</p>
                    <p>♥</p>
                </div>

                <div class="middle">
                    <div>
                        <p class="middle">♥</p>
                        <p class="middle">♥</p>
                    </div>

                    <div class="rotate-sign">
                        <p class="middle">♥</p>
                    </div>
                </div>

                <div class="right">
                    <p>3</p>
                    <p>♥</p>
                </div>
            </div>

            <div class="card clubs">
                <div class="left">
                    <p>4</p>
                    <p>♣</p>
                </div>

                <div class="middle">
                    <div class="middle-p">
                        <div>
                            <p class="middle">♣</p>
                            <p class="middle rotate-sign">♣</p>
                        </div>

                        <div>
                            <p class="middle">♣</p>
                            <p class="middle rotate-sign">♣</p>
                        </div>
                    </div>
                </div>
                <div class="right">
                    <p>4</p>
                    <p>♣</p>
                </div>
            </div>

            <div class="card diamond">
                <div class="left">
                    <p>5</p>
                    <p>♦</p>
                </div>

                <div class="middle">
                        <div class="mid">
                            <div>♦</div>
                            <div>♦</div>
                        </div>

                        <div class="mid">
                            <div>♦</div>
                        </div>

                        <div class="mid">
                            <div>♦</div>
                            <div>♦</div>
                        </div>
                </div>

                <div class="right">
                    <p>5</p>
                    <p>♦</p>
                </div>
            </div>
        </main>
    </body>
</html>
