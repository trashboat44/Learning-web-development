<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Insights Card</title>
        <link rel="stylesheet" href="PP_CSS6.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <section class="main-container">
            <div class="card-content">
                <h2 class="main-text">Get <span class="important-word">insights</span> that help <br> your business grow.</h2>
                <p class="card-summary">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>

                <section class="stadistics-card">
                    <div class="company-number">
                        <p class="word-stadistic"><span class="important-word2"><strong>10k+</strong></span> <br> COMPANIES</p>
                    </div>

                    <div class="company-templates">
                        <p class="word-stadistic"><span class="important-word2"><strong>314</strong></span> <br> TEMPLATES</p>
                    </div>

                    <div class="company-queries">
                        <p class="word-stadistic"><span class="important-word2"><strong>12M+</strong></span> <br> QUERIES</p>
                    </div>
                </section>
            </div>
            
            <div class="image-container">
                <img src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="Product picture" class="product-image">
            </div>
        </section>
    </body>
</html>
