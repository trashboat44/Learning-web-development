<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Preview Card</title>
        <link rel="stylesheet" href="PP_CSS5.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=shopping_cart" />
    </head>

    <body>
        <main>
            <section class="main-card">
                <img src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="Perfume image" class="product-image">
                
                <div class="card-content">
                    <p class="category-card">PERFUME</p>
                    <h1 class="product-name">Gabrielle Essence Eau de Parfum</h1>

                    <p class="product-summary">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfume-creator for the House of CHANEL.</p>
                    
                    <div class="price-container">
                        <p class="product-price">$149.99</p>
                        <del class="product-previous-price">$169.99</del>
                    </div>
                    
                    <button type="button" class="btn-cart"><span class="material-symbols-outlined" aria-hidden="true"> shopping_cart </span> Add to Cart</button>
                </div>
            </section>
        </main>
    </body>
</html>
