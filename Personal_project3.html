<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NFT preview card component</title>
        <link rel="stylesheet" href="PP_CSS3.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
        <script src="https://kit.fontawesome.com/f1efead63c.js" crossorigin="anonymous"></script>
    </head>

    <body>
        <main>
            <article class="card-container">  
                <img src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="photo showing a flower" class="equilibrium-picture">

                <div class="card-body">
                    <h2 class="card-title"><a href="#" class="card-link">Equilibrium #3429</a></h2>
                    <p class="card-description">Our equilibrium collection promotes balance and calm</p>

                    <div class="card-details">
                        <div class="cripto-price">
                            <i class="fa-brands fa-ethereum" aria-hidden="true"></i>
                            <p class="exchange">0.041 ETH</p>
                        </div>

                        <div class="time-left">
                            <i class="fa-solid fa-clock" aria-hidden="true"></i>
                            <p class="remaining-time">3 days left</p>
                        </div>
                    </div>
                </div>

                <hr>

                <footer class="f-article">
                    <img src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="photo of the account owner" class="profile-picture">
                    <p class="footer-p">Creation of <span class="author-name">Christofer Sanchez</span></p>
                </footer>
            </article>
        </main>   
    </body>
</html>
